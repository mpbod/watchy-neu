name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build/host -G Ninja
      - name: Build host tests
        run: cmake --build build/host
      - name: Run C and C++ tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Provision pinned Python tooling
        run: |
          python3 -m venv build/python-tools-venv
          build/python-tools-venv/bin/python -m pip install --requirement tools/font-requirements.txt --requirement tools/factory-flash-requirements.txt
      - name: Run Python tooling tests
        run: build/python-tools-venv/bin/python -m unittest discover -s tests/python -v

  esp-idf-5-5:
    runs-on: ubuntu-latest
    container: espressif/idf@sha256:00e94c6ff8bc1f7bd22b234ff43db3f3056cb33dedac6819df9fbedbcb5c6ebb
    steps:
      - uses: actions/checkout@v4
      - name: Build Watchy 2.0 firmware
        shell: bash
        run: idf.py set-target esp32 && idf.py build
      - name: Build and package SDK samples
        shell: bash
        run: python3 tools/build_samples.py --output-dir build/sample-wpk
